version: '3.8'

services:
  web:
    build: .
    container_name: web-server
    volumes :
      - /home/imer/TFM/yolo/detection_images:/var/www/html/detection_images
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - my_network
    devices:
      - /dev/gpiochip0:/dev/gpiochip0
      - /dev/gpiochip1:/dev/gpiochip1
    privileged: true
    environment:
      DB_HOST: db
      DB_USER: user
      DB_PASSWORD: user
      DB_NAME: sensor_data

  db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: sensor_data
      MYSQL_USER: user
      MYSQL_PASSWORD: user
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - my_network

networks:
  my_network:
    driver: bridge

volumes:
  db_data:
